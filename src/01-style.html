<title>Stockroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: floating glass sidebar over a drifting colour field; a scrolling workspace of data cards,
   tables and a warehouse heat-map. Industrial display type (Chakra Petch) for numbers, Plex Thai for reading. */
:root{
  --font-display:"Chakra Petch","IBM Plex Sans Thai",Tahoma,system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",Tahoma,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;

  --bg:#e7edf0; --glow-a:rgba(240,144,12,.20); --glow-b:rgba(26,143,179,.20);
  --surface:#ffffff; --surface-2:#f3f6f8; --surface-3:#e8eef1;
  --line:#d3dce1; --line-soft:#e3e9ed;
  --ink:#11242d; --ink-2:#425860; --ink-3:#5b7079;
  --accent:#f0900c; --accent-hi:#ffa31f; --accent-ink:#1b1100; --accent-soft:rgba(240,144,12,.15);
  --in:#1a8fb3; --out:#e5533d; --trf:#5d7380; --adj:#b8860b;
  --in-ink:#0f6a86; --out-ink:#b5341f; --trf-ink:#41565f; --adj-ink:#855f00;
  --good:#1f9d6b; --good-ink:#13684a; --warn:#d98a00; --warn-ink:#8a5600; --crit:#d23c3c; --crit-ink:#a62525; --info:#3e6fd1; --info-ink:#2a52a6;
  --tint:.13;
  --shadow-1:0 1px 2px rgba(17,36,45,.06),0 8px 24px rgba(17,36,45,.07);
  --shadow-2:0 18px 60px rgba(8,20,26,.28);
  --side-bg:rgba(13,28,36,.93); --side-ink:#e9f1f4; --side-ink-2:#9fb4bd; --side-line:rgba(255,255,255,.09); --side-hover:rgba(255,255,255,.07);
  --overlay:rgba(8,20,26,.5);
  --r:16px; --r-s:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081015; --glow-a:rgba(255,161,26,.10); --glow-b:rgba(59,184,222,.12);
  --surface:#0f1b22; --surface-2:#142530; --surface-3:#1a2f3b;
  --line:#243a47; --line-soft:#1b2e39;
  --ink:#e8f1f4; --ink-2:#a6b9c2; --ink-3:#8499a3;
  --accent:#ffa11a; --accent-hi:#ffb445; --accent-ink:#1b1100; --accent-soft:rgba(255,161,26,.16);
  --in:#3bb8de; --out:#ff7d66; --trf:#8fa5b1; --adj:#e0b23a;
  --in-ink:#6fd0ee; --out-ink:#ff9c88; --trf-ink:#b2c4ce; --adj-ink:#efc65d;
  --good:#34c88f; --good-ink:#62d9a8; --warn:#f0a62a; --warn-ink:#f4bb55; --crit:#f26a6a; --crit-ink:#ff8f8f; --info:#6e97f0; --info-ink:#9ab6f6;
  --tint:.18;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-2:0 18px 60px rgba(0,0,0,.6);
  --side-bg:rgba(7,15,20,.88); --overlay:rgba(2,8,11,.66); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#081015; --glow-a:rgba(255,161,26,.10); --glow-b:rgba(59,184,222,.12);
  --surface:#0f1b22; --surface-2:#142530; --surface-3:#1a2f3b;
  --line:#243a47; --line-soft:#1b2e39;
  --ink:#e8f1f4; --ink-2:#a6b9c2; --ink-3:#8499a3;
  --accent:#ffa11a; --accent-hi:#ffb445; --accent-ink:#1b1100; --accent-soft:rgba(255,161,26,.16);
  --in:#3bb8de; --out:#ff7d66; --trf:#8fa5b1; --adj:#e0b23a;
  --in-ink:#6fd0ee; --out-ink:#ff9c88; --trf-ink:#b2c4ce; --adj-ink:#efc65d;
  --good:#34c88f; --good-ink:#62d9a8; --warn:#f0a62a; --warn-ink:#f4bb55; --crit:#f26a6a; --crit-ink:#ff8f8f; --info:#6e97f0; --info-ink:#9ab6f6;
  --tint:.18;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-2:0 18px 60px rgba(0,0,0,.6);
  --side-bg:rgba(7,15,20,.88); --overlay:rgba(2,8,11,.66); color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--font-mono);font-feature-settings:"zero" 0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* drifting colour field */
.field-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.field-bg i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.field-bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--glow-a);animation:drift1 26s ease-in-out infinite alternate}
.field-bg i:nth-child(2){width:42vmax;height:42vmax;right:-14vmax;bottom:-16vmax;background:var(--glow-b);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(1.1)}}

/* shell */
.app{position:relative;z-index:1;min-height:100vh}
.side{position:fixed;z-index:30;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:248px;border-radius:22px;background:var(--side-bg);color:var(--side-ink);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--side-line);box-shadow:var(--shadow-2);display:flex;flex-direction:column;padding:18px 12px 14px;transition:transform .45s var(--ease)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brand-mark{width:40px;height:40px;flex:none}
.brand b{display:block;font:700 19px/1 var(--font-display);letter-spacing:.14em}
.brand span{display:block;margin-top:4px;font-size:11.5px;color:var(--side-ink-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;padding-right:2px}
.nav-label{margin:14px 10px 6px;font:600 10.5px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--side-ink-2);opacity:.8}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--side-ink-2);text-decoration:none;font-weight:500;transition:background .25s,color .25s,transform .25s var(--ease)}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:var(--side-hover);color:var(--side-ink);transform:translateX(3px)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--side-ink)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.nav .badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--crit);color:#fff;font:600 11px/18px var(--font-display);text-align:center}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--side-ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--good);opacity:0;animation:ping 2.4s ease-out infinite}
.dot.off{background:var(--warn)}.dot.off::after{border-color:var(--warn)}
@keyframes ping{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.scrim{position:fixed;inset:0;z-index:25;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s}
.main{margin-left:284px;padding:0 24px 56px;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:16px 0 14px;margin-bottom:6px}
.top::before{content:"";position:absolute;inset:0 -24px;z-index:-1;background:linear-gradient(var(--bg) 55%,transparent);opacity:.9}
.top h1{font:700 26px/1.1 var(--font-display);letter-spacing:.01em;min-width:0}
.top .crumb{display:block;font:500 11px/1 var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.top .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:transform .25s var(--ease),border-color .2s,color .2s,box-shadow .2s}
.icon-btn:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-1)}
.icon-btn svg{width:19px;height:19px}
.menu-btn{display:none}
.search-btn{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);min-width:230px;transition:border-color .2s,box-shadow .2s}
.search-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-1)}
.search-btn svg{width:17px;height:17px}
.search-btn .st{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint-tab svg,.seg svg,.chip svg,.tag svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
kbd{font:500 11px/1 var(--font-mono);padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}

/* view + entrance */
.view{min-width:0}
.view.enter>*{animation:rise .55s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view.enter .stagger>*{animation:rise .6s var(--ease) both}
.view.enter .stagger>*:nth-child(1){animation-delay:.04s}.view.enter .stagger>*:nth-child(2){animation-delay:.09s}.view.enter .stagger>*:nth-child(3){animation-delay:.14s}.view.enter .stagger>*:nth-child(4){animation-delay:.19s}.view.enter .stagger>*:nth-child(5){animation-delay:.24s}.view.enter .stagger>*:nth-child(6){animation-delay:.29s}.view.enter .stagger>*:nth-child(7){animation-delay:.34s}.view.enter .stagger>*:nth-child(8){animation-delay:.39s}.view.enter .stagger>*:nth-child(n+9){animation-delay:.44s}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.card-h h2,.card-h h3{font:600 16px/1.2 var(--font-display);letter-spacing:.01em}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.card-b{padding:16px 18px 18px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-3);font-size:12.5px}
.sec-gap{margin-top:16px}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--ink);transition:transform .2s var(--ease),box-shadow .25s,border-color .2s,background .2s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover{border-color:var(--ink-3);transform:translateY(-1px);box-shadow:var(--shadow-1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi);box-shadow:0 8px 26px -6px var(--accent)}
.btn.in{background:var(--in);border-color:var(--in);color:#04141b}
.btn.out{background:var(--out);border-color:var(--out);color:#1c0600}
.btn.danger{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 11px;border-radius:9px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;line-height:20px;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--trf)) calc(var(--tint)*100%),transparent);color:var(--ci,var(--trf-ink))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--trf))}
.pill.ok{--c:var(--good);--ci:var(--good-ink)}.pill.low{--c:var(--warn);--ci:var(--warn-ink)}.pill.out{--c:var(--crit);--ci:var(--crit-ink)}.pill.over{--c:var(--info);--ci:var(--info-ink)}
.pill.IN{--c:var(--in);--ci:var(--in-ink)}.pill.OUT{--c:var(--out);--ci:var(--out-ink)}.pill.TRF{--c:var(--trf);--ci:var(--trf-ink)}.pill.ADJ{--c:var(--adj);--ci:var(--adj-ink)}
.pill.off{--c:var(--ink-3);--ci:var(--ink-3)}
.tag{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);transition:all .2s var(--ease)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-3);gap:2px;max-width:100%;overflow:auto}
.seg button{border:0;background:transparent;height:34px;padding:0 15px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .25s var(--ease),color .2s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.fld>label i{color:var(--crit);font-style:normal}
.in-ctl,select.in-ctl,textarea.in-ctl{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s;min-width:0}
textarea.in-ctl{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.in-ctl:hover{border-color:var(--ink-3)}
.in-ctl:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.in-ctl[readonly]{color:var(--ink-3)}
.in-ctl.bad{border-color:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 18%,transparent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.search-in{position:relative;flex:1;min-width:200px;max-width:380px}
.search-in svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search-in .in-ctl{padding-left:40px;background:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .in-ctl{width:auto;min-width:150px;background:var(--surface)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;text-align:left;padding:11px 14px;font:600 11.5px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.tbl .sku{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--ink-3)}
.qty-pos{color:var(--in-ink);font-weight:600}.qty-neg{color:var(--out-ink);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--surface-3);position:relative;overflow:hidden;min-width:70px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c,var(--good));width:0;transition:width .9s var(--ease)}
.bar>u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink-2);opacity:.55}
.bar.ok{--c:var(--good)}.bar.low{--c:var(--warn)}.bar.out{--c:var(--crit)}.bar.over{--c:var(--info)}.bar.acc{--c:var(--in)}

/* KPI */
.kpi{position:relative;overflow:hidden;padding:16px 18px 16px;transition:transform .35s var(--ease),box-shadow .35s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-2)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--k,var(--accent)) 0%,transparent 70%);opacity:.22;transition:transform .6s var(--ease)}
.kpi:hover::after{transform:scale(1.5)}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kpi .lbl svg{width:17px;height:17px;color:var(--k,var(--accent))}
.kpi .val{margin-top:10px;font:700 34px/1 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;font-weight:600;color:var(--ink-3);margin-left:4px}
.kpi .foot{margin-top:8px;font-size:12px;color:var(--ink-3)}

/* chart */
.chart{position:relative;width:100%;min-height:236px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{fill:var(--ink-3);font:500 11px var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .gl.base{stroke-dasharray:none;stroke:var(--ink-3);opacity:.5}
.chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}
.chart .hit{fill:transparent}
.chart .band{fill:var(--ink);opacity:0;transition:opacity .15s}
.chart .band.on{opacity:.06}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;padding:9px 12px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:12.5px;box-shadow:var(--shadow-2);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;min-width:150px}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-family:var(--font-display);margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:16px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0}
.hbar .bar{height:10px}

/* heat map */
