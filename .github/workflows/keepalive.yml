# Supabase Free จะ pause โปรเจกต์ที่ไม่มี activity ~1 สัปดาห์ — workflow นี้เรียก ping() ทุกวันเพื่อกันไม่ให้ pause
# ตั้ง Secrets ที่ Settings → Secrets and variables → Actions: SUPABASE_URL, SUPABASE_ANON_KEY (ใช้ anon key เท่านั้น)
# หมายเหตุ: GitHub จะปิด scheduled workflow อัตโนมัติถ้า repo ไม่มี commit/activity ~60 วัน — ให้กด Enable ใหม่ใน tab Actions
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC ทุกวัน (10:17 เวลาไทย)
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_ANON_KEY" || { echo "::error::ตั้ง secrets SUPABASE_URL / SUPABASE_ANON_KEY ก่อน"; exit 1; }
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; cat /tmp/out; echo
          [ "$code" = "200" ] || [ "$code" = "204" ]
